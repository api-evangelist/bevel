aid: bevel
name: Bevel
description: >-
  Bevel is a consumer digital-health application, built by Finerpoint, Inc., that
  acts as an AI-powered "connected health coach." It consolidates and interprets
  health data from wearables (Apple Watch, Oura, Garmin, Amazfit) and lab providers
  (Labcorp, Quest, LifeLabs) into a single view, scoring daily strain, sleep,
  recovery, stress/energy, nutrition, cycle, biological age and strength training.
  Its "Bevel Intelligence" layer delivers conversational, research-backed guidance,
  personalized workout plans and daily check-ins. Bevel is a mobile-first consumer
  product with no publicly documented developer API; this profile captures its
  public web, support, roadmap and legal surface. Backed by General Catalyst.
